[project]
name = "enterprise-cloud-architect-agent"
version = "1.0.0"
description = "Enterprise Multi-Agent Cloud Transformation Co-Pilot built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
